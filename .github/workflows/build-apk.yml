name: Build NovelAI Reader APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses and ensure SDK packages
        run: |
          CMDLINE="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$CMDLINE" --licenses > /dev/null || true
          "$CMDLINE" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: |
          PROJ="$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name settings.gradle | head -n 1)")"
          echo "Building Gradle project at: $PROJ"
          gradle -p "$PROJ" :app:assembleRelease --stacktrace
          echo "PROJ_DIR=$PROJ" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noveldragon-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/release/app-release.apk
