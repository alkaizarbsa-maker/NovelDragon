name: Build NovelAI Reader APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses and ensure SDK packages
        run: |
          CMDLINE="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$CMDLINE" --licenses > /dev/null || true
          "$CMDLINE" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fetch project bundle
        run: |
          rm -rf project
          mkdir project
          curl -L -o bundle.zip "https://user.uploads.dev/file/bd3f0008fb0c2bdcef5b73cd146b7989.zip"
          unzip -q bundle.zip -d project
          ls project

      - name: Overlay updated page (if present in repo)
        run: |
          if [ -f "app/src/main/assets/www/index.html" ]; then
            cp "app/src/main/assets/www/index.html" project/app/src/main/assets/www/index.html
            echo "Used page from repo."
          else
            echo "Used bundled page."
          fi

      - name: Build release APK
        run: gradle -p project :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noveldragon-apk
          path: project/app/build/outputs/apk/release/app-release.apk
